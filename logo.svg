<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <defs>
        <filter id="paperShadow" x="-15%" y="-15%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1F2937" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- 代码纸张：透明底、白色纸面、折角、柔和投影 -->
    <g filter="url(#paperShadow)">
        <!-- 纸面（右上角折角） -->
        <path d="M 104 26 H 362 L 440 104 V 454
                 A 31 31 0 0 1 408 486 H 104
                 A 31 31 0 0 1 72 454 V 58
                 A 31 31 0 0 1 104 26 Z"
              fill="#FFFFFF" stroke="#C4CAD6" stroke-width="9" stroke-linejoin="round"/>
        <!-- 折角：仅填充，对角折痕由纸面轮廓自带 -->
        <path d="M 362 26 L 440 104 L 362 104 Z" fill="#E8EAF0"/>
    </g>
    <!-- 折痕分隔线 -->
    <line x1="362" y1="104" x2="440" y2="104" stroke="#D2D7E1" stroke-width="7" stroke-linecap="round"/>

    <!-- 代码行：语法高亮色带 + 编辑光标 -->
    <g>
        <!-- 第 1 行 -->
        <rect x="122" y="164" width="132" height="22" rx="11" fill="#F59E0B"/>
        <rect x="317" y="164" width="66" height="22" rx="11" fill="#98A1B2"/>

        <!-- 第 2 行（缩进） -->
        <rect x="156" y="219" width="86" height="22" rx="11" fill="#14B8A6"/>
        <rect x="265" y="219" width="118" height="22" rx="11" fill="#98A1B2"/>

        <!-- 第 3 行（缩进） -->
        <rect x="156" y="273" width="180" height="22" rx="11" fill="#98A1B2"/>

        <!-- 第 4 行：编辑光标 -->
        <rect x="122" y="319" width="15" height="40" rx="6" fill="#4F46E5"/>
        <rect x="156" y="328" width="114" height="22" rx="11" fill="#98A1B2"/>
        <rect x="293" y="328" width="94" height="22" rx="11" fill="#F59E0B"/>

        <!-- 第 5 行（缩进） -->
        <rect x="156" y="383" width="103" height="22" rx="11" fill="#14B8A6"/>
        <rect x="282" y="383" width="106" height="22" rx="11" fill="#98A1B2"/>

        <!-- 第 6 行 -->
        <rect x="122" y="432" width="169" height="22" rx="11" fill="#98A1B2"/>
    </g>
</svg>
